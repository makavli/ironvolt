name: itch.io

# Manual only: Actions -> itch.io -> Run workflow.
#   tag       empty = the latest release
#   platforms all, or one of windows / web (web = the html5 channel, played in the page)
#   dry_run   check the setup and the release files, upload nothing
# Uploads the GitHub release's builds with butler; the itch.io page itself (text, pictures) is never touched.
# Needs, once: repository variable ITCH_GAME = "<itch user>/<game page>", and secret BUTLER_API_KEY
# (itch.io -> Settings -> API keys).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest)"
        required: false
        default: ""
      platforms:
        description: "Which builds"
        type: choice
        options: [all, windows, web]
        default: all
      dry_run:
        description: "Check only, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ITCH_GAME: ${{ vars.ITCH_GAME }}
      HAS_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
      PLATFORMS: ${{ inputs.platforms }}
    steps:
      - name: Configured?
        run: |
          missing=""
          [ -z "$ITCH_GAME" ] && missing="the ITCH_GAME repository variable"
          [ "$HAS_KEY" != "true" ] && missing="${missing:+$missing and }the BUTLER_API_KEY secret"
          if [ -n "$missing" ]; then echo "::error::Set $missing first."; exit 1; fi
          case "$ITCH_GAME" in */*) ;; *) echo "::error::ITCH_GAME must look like user/game"; exit 1 ;; esac

      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          tag="$WANTED"
          [ -z "$tag" ] && tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          case "$tag" in v[0-9]*) ;; *) echo "::error::'$tag' is not a release tag"; exit 1 ;; esac
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D dl
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mkdir -p itch/windows itch/web
          want() { [ "$PLATFORMS" = all ] || [ "$PLATFORMS" = "$1" ]; }
          if want windows; then cp dl/Ironvolt.exe itch/windows/; fi
          if want web; then unzip -q dl/Ironvolt-web.zip -d itch/web; test -f itch/web/index.html; fi
          ls -la dl

      - name: Install butler
        run: |
          # pinned and checked: this job later holds the itch key. To update, take the version and sha256 from broth.
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/15.32.0/archive/default
          echo "2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5  butler.zip" | sha256sum -c -
          unzip -q butler.zip -d butler && chmod +x butler/butler && butler/butler -V

      - name: Upload (only this step sees the key)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DRY: ${{ inputs.dry_run }}
        run: |
          v="${TAG#v}"
          want() { [ "$PLATFORMS" = all ] || [ "$PLATFORMS" = "$1" ]; }
          push() {
            if [ "$DRY" = "true" ]; then echo "dry run: would push $1 to $ITCH_GAME:$2 ($v)"
            else butler/butler push "$1" "$ITCH_GAME:$2" --userversion "$v"; fi
          }
          butler/butler status "$ITCH_GAME" || { echo "::error::butler cannot see $ITCH_GAME: does the page exist, is the key right?"; exit 1; }
          want windows && push itch/windows windows
          want web && push itch/web html5
          [ "$DRY" = "true" ] || butler/butler status "$ITCH_GAME"
          {
            echo "### itch.io: $TAG ($PLATFORMS)$([ "$DRY" = "true" ] && echo ', dry run')"
            echo "https://${ITCH_GAME%%/*}.itch.io/${ITCH_GAME#*/}"
          } >> "$GITHUB_STEP_SUMMARY"
